<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
</head>

<body style="
            margin: 0;
            padding: 0;
            background-color: #0B0F0D;
            font-family: Arial, sans-serif;
        ">

    <div style="
                max-width: 600px;
                margin: 40px auto;
                background-color: #121815;
                border: 1px solid #29332D;
                border-radius: 12px;
                padding: 30px;
                color: #F5F7F6;
            ">

        <h1 style="
                    color: #22C55E;
                    margin-bottom: 25px;
                ">
            Fitness Pro
        </h1>

        <h2>
            {title}
        </h2>

        <div>
            {content}
        </div>

        <hr style="
                    border: 0;
                    border-top: 1px solid #29332D;
                    margin: 30px 0;
                ">

        <p style="
                    color: #A7B0AA;
                    font-size: 12px;
                ">
            Bu e-posta Fitness Pro sistemi tarafından otomatik olarak gönderilmiştir.
        </p>

    </div>
</body>

</html>
