<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fitness Pro - Kayıt Sonrası E-posta Doğrulama">
    <meta name="theme-color" content="#0B0F0D">

    <title>Fitness Pro | E-posta Doğrulama</title>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Fitness Pro Design System & Page Styles -->
    <link rel="stylesheet" href="../Css/Core/DesignSystem.css">
    <link rel="stylesheet" href="../Css/UI/EpostaDogrulama.css">
    <script src="../JavaScripts/config.js"></script>
</head>

<body>

    <main class="verification-container">

        <!-- 2.png Merkez Kart -->
        <div class="verification-card">

            <!-- 2.png Tasarımındaki 'Icon' yerine yerleştirilen Kilit İkonu Rozeti -->
            <div class="card-icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>

            <!-- Kart Başlık ve Bilgilendirme -->
            <header class="verification-header">
                <h1 class="verification-title">E-posta Doğrulama</h1>
                <p class="verification-subtitle">
                    Hesap güvenliğiniz için <span class="verification-email-chip" id="userEmailDisplay">e-posta adresinize</span> gönderilen 6 haneli kodu giriniz.
                </p>
            </header>

            <!-- Doğrulama Formu -->
            <form class="verification-form" id="verificationForm" onsubmit="return false;">

                <!-- 2.png: "Doğrulama Kodunuz" Alanı -->
                <div class="input-block">
                    <label for="verificationCodeInput" class="input-label">Doğrulama Kodunuz</label>
                    
                    <div class="code-input-wrapper">
                        <input 
                            type="text" 
                            id="verificationCodeInput" 
                            name="code" 
                            class="verification-code-input" 
                            inputmode="numeric" 
                            pattern="[0-9]{6}" 
                            maxlength="6" 
                            placeholder="------" 
                            autocomplete="one-time-code"
                            aria-label="6 haneli doğrulama kodu"
                            required
                        >
                    </div>
                </div>

                <!-- 2.png: Yeşil "Onayla" Butonu -->
                <button type="button" class="btn-confirm" id="btnConfirm">
                    Onayla
                </button>

                <!-- 2.png Alt Satır: Sayac:0000 | Tekrar Gonder -->
                <div class="verification-footer">
                    <div class="timer-box">
                        <span>Sayaç:</span>
                        <span class="timer-digits" id="timerDigits">05:00</span>
                    </div>

                    <!-- 5 Dakika Bitince Görünür Olan Buton -->
                    <button type="button" class="btn-resend hidden" id="btnResend">
                        Tekrar Gönder
                    </button>
                </div>

                <!-- Bildirim ve Hata Kutusu -->
                <div class="verification-alert" id="verificationAlert" role="alert"></div>

            </form>

        </div>

        <div class="verification-sublink">
            <a href="Login.html">&larr; Giriş Ekranına Dön</a>
        </div>

    </main>

    <!-- Core & Endpoints -->
    <script src="../JavaScripts/Core/auth.js"></script>
    <script src="../JavaScripts/EndPoint/TwoFactorEndpoint.js"></script>
    <!-- Page Logic -->
    <script src="../JavaScripts/UI/EpostaDogrulama.js"></script>

</body>

</html>
