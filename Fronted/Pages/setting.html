<!doctype html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F0D">
    <title>Fitness Pro - Ayarlar</title>
    <link rel="stylesheet" href="../Css/UI/setting.css">
</head>

<body>
    <div class="settings-shell">
        <div class="sidebar-overlay" data-sidebar-close aria-hidden="true"></div>
        <aside class="settings-sidebar" id="settings-sidebar" aria-label="Ayarlar menüsü">
            <div class="sidebar-header"><a class="brand" href="index.html"
                    aria-label="Fitness Pro ana sayfa"><b>FP</b>Fitness <em>Pro</em></a><button class="sidebar-close"
                    type="button" data-sidebar-close aria-label="Menüyü kapat">×</button></div>
            <div class="sidebar-profile">
                <div class="avatar avatar-large" aria-hidden="true">US</div>
                <div><strong>Username</strong><span>Üye hesabı</span></div>
            </div>
            <nav class="settings-navigation" aria-label="Ayar kategorileri">
                <p class="nav-label">HESAP</p><button type="button" class="nav-btn active" data-view="account"
                    aria-current="page"><i>◉</i>Hesap Ayarları</button><button type="button" class="nav-btn"
                    data-view="password"><i>⌁</i>Şifre Güncelle</button>
                <p class="nav-label secondary">YÖNETİM</p><button type="button" class="nav-btn"
                    data-view="applications"><i>▤</i>Başvurularım</button><button type="button" class="nav-btn"
                    data-view="subscriptions"><i>◇</i>Aboneliklerim</button><button type="button" class="nav-btn"
                    data-view="coaches"><i>♧</i>Hocalarım</button><button type="button" class="nav-btn"
                    data-view="messages"><i>✉</i>Mesaj İsteklerim</button>
            </nav>
        </aside>
        <main class="settings-main">
            <header class="mobile-topbar"><button class="menu-toggle" type="button" data-sidebar-open
                    aria-label="Ayarlar menüsünü aç" aria-controls="settings-sidebar"
                    aria-expanded="false"><i></i><i></i><i></i></button><span>AYARLAR</span>
                <div class="avatar avatar-small" aria-hidden="true">US</div>
            </header>
            <section class="content-area" aria-live="polite">
                <div id="dynamic-content"></div>
            </section>
        </main>
    </div>
    <script src="../JavaScripts/UI/Setting.js"></script>
</body>

</html>
